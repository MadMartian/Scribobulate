# Scribobulate preview reading themes.
#
# This file is DATA. The theming engine (src/theme.rs) holds no per-theme
# knowledge — no colour constants, no `if theme == "sepia"` branches. A new theme
# is a block here, not a code change.
#
# ── Resolution order ───────────────────────────────────────────────────────────
# Each key resolves by the first link that supplies it:
#   1. the selected theme's key
#   2. [themes.system]'s key           (i.e. what the app would otherwise hardcode)
#   3. the system GTK theme probe + derivation (Palette's mix/contrast walk)
# So a theme states only what makes it distinctive. Selecting "system" means links
# 2 and 3 only — byte-identical to the app's pre-theming rendering.
#
# ── Where this file is read from ───────────────────────────────────────────────
# First match wins; this copy is compiled into the binary as the last-resort
# fallback, so a missing or malformed file can never prevent startup.
#   1. ${XDG_CONFIG_HOME:-~/.config}/scribobulate/themes.toml   (user override)
#   2. ${XDG_DATA_HOME:-~/.local/share}/scribobulate/themes.toml (per-user install)
#   3. $XDG_DATA_DIRS/scribobulate/themes.toml                   (system install)
# A user file is MERGED over this one per theme id: override one key of
# [themes.sepia] without restating the theme, or add a whole new [themes.<id>].
#
# ── Units ──────────────────────────────────────────────────────────────────────
# * Colours are "#rrggbb", or "#rrggbb_aa" where _aa is a hex alpha byte
#   (e.g. "#FFD133_61" = #FFD133 at 38%).
# * Pixel metrics are DESIGN-TIME values at zoom 1.0. The app scales every one of
#   them by the active zoom when it applies them; a theme never expresses "pixels
#   at the current zoom".
# * Scales are Pango multipliers over the page's font size, so they compose with
#   zoom for free. There is deliberately NO font_size key: zoom owns CSS
#   font-size exclusively.
# * Out-of-range values are clamped, not rejected — a theme cannot break layout.

# ── System ─────────────────────────────────────────────────────────────────────
# The base theme, and the register of every styling value the app would otherwise
# hardcode. It sets ONLY those values; everything it omits (page background, body
# foreground, body font, link, code fills, blockquote bar, selection, table
# chrome, syntax theme) falls through to the desktop GTK theme and the app's
# existing derivation — i.e. today's exact appearance, unchanged.
[themes.system]
name = "System"
symbol = "🪟"

# Colours that are literals in the source today.
annotation_hl   = "#FFD133_61"   # translucent amber wash behind an annotated claim
find_hl_all     = "#f6d32d"      # every find match
find_hl_current = "#ff7800"      # the current find match, inside a table cell only
                                 # (in body text the current match uses the real
                                 # buffer selection; a cell label cannot, ScrAP-36)
mark_bg         = "#fff59d_88"   # ==highlight== (mark) — a neutral pale-yellow highlighter
                                 # wash (matches theme.rs's last-resort floor)

# Typography that is literal in the source today.
heading_scale    = [2.2, 1.8, 1.48, 1.2, 1.0]  # h1..h5 (h6-and-deeper folds to h5)
heading_weight   = 700
bold_weight      = 700
supsub_scale     = 0.72
superscript_rise = 4              # points, up
subscript_rise   = -2             # points, down

# Decoration lines the app draws today — i.e. none of them, on either side of a
# heading. Stated here rather than omitted because [themes.system] is the register of
# what the app would otherwise hardcode, and "no heading rule" IS the hardcoded answer.
# Vocabulary: "none" | "single" | "double" | "wavy"; the OVERLINE has only none/single
# (Pango's attribute does), so a bolder value there is clamped to a single line.
heading_overline  = "none"
heading_underline = "none"
link_underline    = "single"   # what the body `link` tag has always drawn

# Decoration geometry that is literal in the source today (design-time px @ zoom 1.0).
heading_space_below  = [4, 4, 2, 2, 2]  # h1..h5 space below the heading line
heading_space_above  = [0, 0, 0, 0, 0]  # h1..h5 space ABOVE it — zero, because the
                                        # heading tags set no pixels_above_lines before
                                        # this key existed
heading_band_padding = 12               # band edge → heading text, each side. NON-ZERO
                                        # unlike the other decoration defaults: padding is
                                        # part of drawing a band correctly, not a flourish.
                                        # Inert here regardless — the inset is applied only
                                        # to a level that HAS a band, and System bands none
blockquote_bar_width = 3             # the quote's left accent bar
blockquote_text_gap  = 10            # bar → quoted text
list_step            = 28            # per-nesting-level list indent
list_item_gap        = 8             # space between consecutive list items
rule_space           = 4             # above/below a horizontal rule
table_cell_padding_v = 4
table_cell_padding_h = 10
table_border_width   = 1
table_cell_radius    = 0

# ── Sepia ──────────────────────────────────────────────────────────────────────
# A book-like reading theme: a serif body face on a warm off-white page, with
# soft-brown text. Body contrast is 7.51:1 — WCAG AAA.
[themes.sepia]
name       = "Sepia"
symbol     = "📖"
background = "#f4ecd8"
foreground = "#5b4636"
accent     = "#7a4b2a"   # the link colour and blockquote bar derive from this

# Always terminate a font stack with a generic family. An unknown family falls
# back to fontconfig's SANS default, not to serif — a stack without a generic
# terminator silently lands on sans and defeats the theme. (Neither Charter nor
# Georgia ships on a stock Linux box; the Liberation/Noto entries are what
# actually resolve there.)
font_family   = 'Charter, Georgia, "Liberation Serif", "Noto Serif", serif'
syntect_theme = "Solarized (light)"

# Warm replacements for the three highlight literals: the system yellows are a
# near-invisible wash on a cream page.
annotation_hl   = "#d9a441_61"
find_hl_all     = "#d9c04a"
find_hl_current = "#c86428"
mark_bg         = "#d8a98a_66"   # warm tan-rose highlighter — distinct from the amber/yellow
                                 # find & annotation washes, and legible on the cream page

# Everything else is omitted on purpose, and is therefore DERIVED from
# background/foreground/accent exactly as the system theme derives it from the
# desktop: link, code_inline_bg, code_block_bg, blockquote_bar, selection_bg,
# table_border, table_head_bg — and the whole of the typography and geometry
# above, so Sepia keeps the system's heading hierarchy and spacing.

# ── Synthwave ──────────────────────────────────────────────────────────────────
# A midnight 80s outrun theme: neon on deep indigo. It's a DARK page, so — unlike
# the light themes' opaque yellows — the highlights are neon *washes* (translucent),
# because the light body text has to stay readable on top of them.
[themes.synthwave]
name          = "Synthwave"
symbol        = "🌆"
background    = "#1a1033"   # midnight indigo
foreground    = "#e6d9ff"   # soft lavender-white — ~11:1 on the page (WCAG AAA)
accent        = "#ff3caf"   # neon magenta: blockquote bar + selection derive from it
link          = "#2de1ff"   # neon cyan links — the classic pink/cyan outrun pairing
heading_color = "#ffc21e"   # sunset-gold — colours the doc headings AND the table header text
list_marker   = "#ff3caf"   # neon-magenta bullets/numerals/checkboxes — the signature outrun accent
# Font stack. JURA leads deliberately: it's the packaged (`apt install fonts-jura`),
# reliably-rendering Eurostile-vein face — and, crucially, Exo 2's usual Google-Fonts
# distribution is a VARIABLE font (`Exo2[wght].ttf`) that GTK 4.6's Pango does NOT
# render (it falls through to plain sans, and worse, SHADOWS a working Jura if listed
# first — confirmed by isolation test). So Exo 2 sits AFTER Jura, reachable only by a
# STATIC Exo 2 install. Everything falls through to a clean sans on a bare box; the
# neon palette carries the look regardless. Generic-terminated.
font_family   = 'Jura, "Exo 2", "Chakra Petch", Cantarell, "Noto Sans", "Liberation Sans", sans-serif'
# Headings get a distinct DISPLAY face (illegible as body, perfect for large headings):
# Orbitron/Michroma are the aspirational outrun faces; Exo 2/Jura are the readable
# fallbacks; generic-terminated. `apt install fonts-orbitron`? — not packaged on Debian,
# so on a stock box headings fall through to Exo 2/Jura/sans like the body.
heading_font  = 'Orbitron, Michroma, Jura, "Exo 2", sans-serif'
# PER-LEVEL heading overrides. Five slots — h1 · h2 · h3 · h4 · h5-and-deeper — and an
# EMPTY slot means "use the single heading_color/heading_font above", which is why only
# the first entry is filled: the h1 alone takes the signature neon magenta (5.59:1 on
# this page) and every deeper level stays sunset-gold, so the document gains a title
# colour without turning into a rainbow. The face override is the same idea one notch
# further: Michroma is the wider, more monumental of the two outrun display faces, which
# reads well at h1's 2.2x and badly at h4's 1.2x — on a stock box neither is installed
# and both stacks fall through to Jura/Exo 2 identically.
heading_colors = ["#ff3caf", "", "", "", ""]
heading_fonts  = ['Michroma, Orbitron, Jura, sans-serif', "", "", "", ""]
# A BAND behind the top two heading levels — the outrun sunset behind the title, and the
# first decoration in the vocabulary that is a drawn thing in its own right rather than a
# property of something already painted. Per level, and only h1/h2 are stated: banding
# every level turns a document into a stack of stripes, and "band the title" is the want.
# The gradient runs from each level's own fill down to the deep indigo of the page, so the
# band dissolves into the page instead of ending on a hard edge. Both fills clear the
# heading INK against them (the ink is checked against the band, not the page, wherever a
# band exists — see theme.rs).
heading_band_bg          = ["#2b1152", "#221046", "", "", ""]
heading_band_gradient_to = "#1a1033"
heading_band_radius      = 6
# Operator's call 2026-08-26: flush left, no inset. `heading_band_padding` (TDD
# 18.25's fix) defaults to a non-zero 12px everywhere else because padding is part
# of drawing a band correctly, not a flourish — but it is a normal per-theme metric
# like any other, and this theme's title reads better flush against the band's own
# edge than indented from it.
heading_band_padding = 0
# Operator's call 2026-08-26: the per-level colour and the band stay — no heading rule
# though. `heading_underline`/`heading_underline_rgba` (TDD 18.22) were tried here too;
# dropped by preference, independently of the colour/band decision above (these three
# keys are independent knobs, not a package — TDD 18.21/18.22/18.25 are three separate
# rubrics for a reason). `heading_space_above` below is kept regardless — it is its own
# taste of breathing room above a heading, not exclusively "room for the rule to sit in".
heading_space_above = [18, 14, 10, 8, 8]
#
# The outrun pairing, applied to links and to struck text: cyan ink over a magenta line,
# and a magenta strike that reads as a deliberate mark rather than as the lavender body
# ink with a scratch through it. The link underline's colour is stated INDEPENDENTLY of
# the link's own colour — that separation is the point of the key; a theme that wants
# them to match simply omits it.
link_underline_rgba = "#ff3caf"
strikethrough_rgba  = "#ff3caf"
syntect_theme = "base16-eighties.dark"   # a literal 80s palette for fenced code

# Neon highlights — the amber/yellow defaults are wrong on a neon-dark page, and an
# OPAQUE bright highlight would bury the light body text. Washes keep text legible.
annotation_hl   = "#ff3caf_4d"   # translucent magenta wash (~30%)
find_hl_all     = "#ff3caf_66"   # magenta wash (~40%) — distinct from the gold headings and cyan links
find_hl_current = "#ff2f92"      # hot pink — the current match inside a table cell
mark_bg         = "#39ff14_4d"   # RADIOACTIVE toxic-green wash (~30%) — the ==highlight== marker.
                                 # A neon hue deliberately outside the magenta/cyan/gold outrun
                                 # palette (operator's pick), distinct from the magenta annotation/find
                                 # washes; translucent so the lavender body text stays readable.

# Magenta SHADES (deliberately different): a bright neon horizon line for the rule,
# a deeper muted magenta for the table grid so it reads as an outline, not a cage.
rule          = "#ffc21e"   # sunset-GOLD horizon line — a different hue from the magenta grid,
                            # so a thin rule reads as its own element, not another table border
table_border  = "#8f3a72"   # deeper, muted magenta grid
table_head_bg = "#3d1a34"   # dark magenta header fill — matches the grid; gold header text reads on it

# Everything omitted derives from background/foreground/accent as usual:
# code fills, blockquote_bar, selection_bg, table chrome, and all typography/geometry.

# ── Candy ──────────────────────────────────────────────────────────────────────
# A sweet-shop theme on a deep-indigo page, built to an operator-supplied six-swatch
# palette: cotton pink #F6B6D4, hot pink #FB6F92, turquoise #61C7C9, lemon #F6E94F,
# orchid #A063C8, grape #6C2A92.
#
# ── The rule that decides every role here: LUMINANCE, not vividness ────────────
# A swatch's measured luminance decides whether it can be INK (text on the page) or
# a FILL (a surface with text on top). Nothing about how "vivid" a colour looks
# predicts which, and getting it backwards is invisible until it is rendered:
#
#   lemon  0.784 ┐                     grape  0.069 ─ the ONLY swatch under the fill
#   cotton 0.578 ├ INK — far too bright             ceiling: the palette supplies
#   turq   0.476 │ to sit behind text               its own dark surface
#   hot pk 0.340 ┘
#   orchid 0.206 ─ neither, quite: too dark to read as text on the page (3.9:1),
#                  too bright to carry text (2.2:1). It is used ONLY as a solid
#                  graphic — the blockquote bar — which needs neither.
#
# The ceiling is set by the BODY INK, not by the page: for body text to keep 4.5:1
# on a fill, that fill must sit at L <= 0.0896. Choosing cotton pink as the body ink
# rather than a white costs real headroom (a near-white ink would allow L <= 0.166) —
# a deliberate trade, because pink-on-grape is the whole character of the theme.
#
# ── Why the highlights are SHADES, not washes ──────────────────────────────────
# The previous draft of this theme made every overlay a translucent wash of a bright
# palette hue, which is the intuitive thing to do and was measurably wrong: over a
# dark page a wash composites TOWARD the page, so it loses exactly the chroma that
# made the colour worth choosing. A chartreuse wash landed on #695526 — mud. The fix
# is to keep the chroma and drop the VALUE instead: each overlay below is a shade of
# a distinct palette hue, fully saturated, sitting under the ceiling. Desaturating
# gives mud; shading gives a rich band. On a dark theme, always shade.
[themes.candy]
name          = "Candy"
symbol        = "🍬"
background    = "#101a4d"   # INDIGO. Chosen over the two other blues that measured just as
                            # well, on grounds the numbers cannot show: a deep TEAL page is
                            # the same hue as the turquoise links, which stay legible but stop
                            # reading as distinct (the trap that killed tomato headings on a
                            # crimson page); and a NAVY/midnight page lands within a whisker
                            # of Synthwave's #1a1033, so the two themes would stop being
                            # tellable apart at a glance. Indigo is clearly blue, clearly not
                            # Synthwave, and leaves every ink within 0.3 of its old value
foreground    = "#f6b6d4"   # cotton-pink body ink — 9.6:1 on the page
accent        = "#fb6f92"   # hot pink
heading_color = "#f6e94f"   # lemon headings — 12.8:1, the palette's brightest against its
                            # darkest, which is the most contrast the palette can offer
link          = "#61c7c9"   # turquoise links — 8.1:1
list_marker   = "#fb6f92"   # hot-pink bullets/numerals/checkboxes — 6.0:1

# A BAND behind h1/h2 (TDD 18.25) — only the top two, same restraint Synthwave uses:
# banding every level turns a document into a stack of stripes. Both fills are
# swatches already vetted elsewhere in this theme, so a band introduces no new hue:
# h1 takes GRAPE — otherwise the one swatch with no role on this page (see the
# luminance table above) — and h2 reuses the exact hot-pink SHADE `table_head_bg`
# already stands on, so a heading banner and a table header read as the same
# surface. Lemon ink clears 4.5:1 on both (7.00:1, 6.30:1) — the singular
# `heading_color` above is what the automated floor checks here since this theme
# has no per-level override. The gradient is safe to fade all the way to the PAGE,
# unlike a light theme would be: Candy's page is dark (#101a4d), so lemon's contrast
# only ever improves along the gradient (12.8:1 at the page end) — the opposite risk
# a light-page theme has to guard against.
heading_band_bg          = ["#6c2a92", "#9e1449", "", "", ""]
heading_band_gradient_to = "#101a4d"
heading_band_radius      = 8

font_family   = 'Comfortaa, Quicksand, Dosis, Cantarell, "Noto Sans", sans-serif'
heading_font  = 'Comfortaa, "M PLUS Rounded 1c", Quicksand, Dosis, sans-serif'
syntect_theme = "base16-ocean.dark"

# One hue per element family. The rule takes the headings' lemon because a rule is a
# section break (heading family). NOTE that ORCHID #A063C8 now has no role at all: its
# luminance (0.206) is simultaneously too dark to read as text on this page (3.9:1) and
# too bright to carry text as a fill (2.2:1), and the one job it did hold — the quote
# bar — has moved to the hot pink. That a whole swatch becomes unusable is a property of
# the DARK page, not of the palette: on a light page orchid would be a perfectly good ink.
blockquote_bar = "#fb6f92"  # HOT PINK bar — 6.0:1 on the page (orchid was 3.9:1), and it
                            # pairs the quote bar with the list markers as one "furniture"
                            # family. A solid graphic carries no text, so the fill ceiling
                            # does not apply and the raw swatch can be used undiluted
rule           = "#f6e94f"  # lemon section rule (heading family)
table_border   = "#61c7c9"  # turquoise grid
table_head_bg  = "#9e1449"  # a SHADE of the hot pink. The raw swatch #fb6f92 is impossible
                            # here: at L=0.340 it is ~4x over the fill ceiling, giving lemon
                            # header text 2.14:1 and body ink 1.61:1 — both unreadable. Shaded
                            # to L=0.083 it keeps the hue and reads 6.3:1 / 4.7:1. This is the
                            # luminance law again: a swatch's ROLE is decided by its value,
                            # and "use the pink here" is a hue instruction, not a value one
selection_bg   = "#274088"  # blue-family. Re-shaded with the page: this and the two code
                            # surfaces below were DERIVED from the old purple page rather than
                            # taken from the palette, so leaving them behind would have left
                            # three off-hue purples on a blue page (body ink 5.8:1)
code_block_bg  = "#070c26"  # RECESSED below the page — on a dark theme a code block reads as
                            # a panel by going darker, not lighter (ink 11.5:1)
code_inline_bg = "#1d2a60"  # LIFTED above the page — deliberately the opposite direction from
                            # the block, so an inline span can never look like a stray fragment
                            # of a fenced block (ink 8.1:1)

# Overlays: one SHADE per palette hue, every one under the L<=0.0896 ceiling, so the
# body ink stays legible on all four AND no two can be confused for each other.
annotation_hl   = "#6c2a92"   # grape   — ink 5.3:1
find_hl_all     = "#0a5658"   # deep turquoise — ink 4.6:1
find_hl_current = "#fb6f92"   # HOT PINK, undiluted. Deliberately BRIGHT rather than shaded:
                              # the current match is a transient pointer, and the shipped
                              # themes treat it that way (Synthwave #ff2f92, Terminal #55ffff
                              # are both far too bright to carry body ink). Being bright is
                              # also what keeps it distinct from the DEEP pink header fill it
                              # necessarily sits beside — same hue, opposite value
mark_bg         = "#5c5200"   # deep lemon — the ==highlight== marker. A shaded gold is the
                              # classic highlighter read, and it is the one overlay that
                              # must never be mistaken for the others (ink 4.7:1)

# Geometry: round and generously padded, with a grid heavy enough to draw a real edge.
blockquote_bar_width = 5
blockquote_text_gap  = 12
list_item_gap        = 10
rule_space           = 6
table_cell_padding_v = 6
table_cell_padding_h = 12
table_border_width   = 2
table_cell_radius    = 8

# ── Terminal ───────────────────────────────────────────────────────────────────
# A retro CRT / phosphor-terminal reading theme (researcher's "Stack B"): green text
# on near-black glass, amber for links/headings (the two classic monochrome-monitor
# phosphors — green and amber), in a monospace face. Distinct from Synthwave's neon
# outrun; a "retro computer" mood. Green CRT base (bg + body) with an otherwise
# canonical 16-colour ANSI/VGA accent set: cyan links/selection, yellow headings,
# a DOS-blue (Norton-Commander) header bar, magenta/blue find+annotation washes,
# grey line work. No heading_font: headings stay mono, just larger.
[themes.terminal]
name          = "Terminal"
symbol        = "👾"
background    = "#000000"   # true black — canonical VGA text-mode backdrop
foreground    = "#aaaaaa"   # ANSI 7 light-gray body (~9:1 on black — WCAG AAA)
accent        = "#00aaaa"   # ANSI 6 cyan base (link/bar/selection overridden below)
link          = "#55ffff"   # ANSI 14 bright cyan links
heading_color = "#ffff55"   # ANSI bright yellow headings (+ table header text)
list_marker   = "#55ff55"   # ANSI 10 bright green — the phosphor-prompt bullet/numeral/checkbox
# GLYPH markers, in place of the drawn dot/numeral/checkbox — the one theme where a
# terminal's own furniture IS the look. Note the ordered glyph replaces the NUMERAL, so
# a numbered list here reads as a run of prompts rather than as 1., 2., 3.: that is the
# point of a terminal theme and it is why the key is inert unless a theme asks for it.
# Both task states are stated, because an unstated one keeps the drawn box and a glyph
# tick beside a drawn box reads as a bug rather than a choice.
list_bullet_glyph       = "▸"
list_ordered_glyph      = "$"
list_task_glyph         = "[ ]"
list_task_checked_glyph = "[x]"
# JetBrains Mono is packaged on Debian AND Fedora; Share Tech Mono is the retro-CRT
# aspirational face; DejaVu Sans Mono is the universal fallback. Generic-terminated.
font_family   = '"JetBrains Mono", "Share Tech Mono", "DejaVu Sans Mono", monospace'
syntect_theme = "base16-ocean.dark"

selection_bg  = "#00aaaa"   # ANSI 6 cyan text-selection
blockquote_bar = "#6c9fff"  # light-blue quote bar

# ANSI-on-black highlights — washes, so the light-gray body text stays readable on them:
annotation_hl   = "#ff55ff_40"   # ANSI 13 bright-magenta wash
find_hl_all     = "#5555ff_59"   # ANSI 12 bright-blue wash
find_hl_current = "#55ffff"      # ANSI 14 bright cyan — current match in a cell
mark_bg         = "#ffb000_4d"   # amber-phosphor wash — the ==highlight== marker; the OTHER classic
                                 # monochrome-monitor phosphor, distinct from the green body & markers

# Grey line work + the DOS blue header bar (Norton-Commander), on the true-black base:
rule          = "#555555"   # grey horizontal rule
table_border  = "#555555"   # ANSI 8 grey grid
table_head_bg = "#0000aa"   # ANSI 4 blue header fill (yellow header text on it)

# ── Bedtime ────────────────────────────────────────────────────────────────────
# A night-reading theme, in a sans face: warm sand ink on a neutral dark-grey page.
# Sepia's mood with its luminance inverted — but NOT its hue, because the page here
# is deliberately neutral (operator-supplied #323232 / #CEBF9F) and the warmth lives
# entirely in the ink. That split decides every other colour in the block:
#
#   * PAGE FURNITURE (rule, table grid, code surfaces) is NEUTRAL GREY — it belongs
#     to the page, and tinting it warm would leave the sand ink with no hue of its own.
#   * CONTENT ACCENTS (headings, links, list markers, quote bar, overlays) are WARM,
#     drawn from the ink's own sand/amber family, so every coloured thing on the page
#     reads as one voice against a grey ground.
#
# Body contrast is 7.07:1 — WCAG AAA, and within a whisker of Sepia's 7.51:1, which
# is the point: the same reading comfort with the lights off.
[themes.bedtime]
name       = "Bedtime"
symbol     = "🛌"
background = "#323232"   # neutral dark grey page
foreground = "#CEBF9F"   # warm sand ink — 7.07:1 (AAA)
accent     = "#D9B87C"   # lighter sand-gold — 6.78:1; the family the furniture accents follow

# Sans, as the theme's defining face. Segoe UI leads because it is the one grotesque
# guaranteed present on Windows; Inter and Source Sans 3 are the good Linux/macOS
# faces; Cantarell/Noto/Liberation carry a bare box. Generic-terminated, as every
# stack here must be.
#   ⚠ Install a STATIC Inter if you install one at all. Google Fonts ships it as a
#   VARIABLE font (`Inter[opsz,wght].ttf`), which GTK 4.6's Pango does not render —
#   and a variable font placed first SHADOWS the working faces behind it, the exact
#   trap that put Exo 2 after Jura in Synthwave above.
font_family   = '"Segoe UI", Inter, "Source Sans 3", Cantarell, "Noto Sans", "Liberation Sans", Arial, sans-serif'
syntect_theme = "base16-eighties.dark"   # its warm orange/gold token set suits the sand ink

# Content accents — all warm, all from the ink's family.
heading_color  = "#E8D9B4"   # a lighter TINT of the body ink — 9.17:1. Headings lift by value
                             # rather than by hue, so the page never gains a second colour
link           = "#E5A855"   # amber — 6.14:1. Far enough round from the sand ink to be seen as
                             # a link at a glance, without introducing a foreign hue
list_marker    = "#D9B87C"   # sand-gold bullets/numerals/checkboxes (marker glyph only)
blockquote_bar = "#D9B87C"   # the same sand-gold: bar and markers read as one "furniture" family

# Page furniture — NEUTRAL, because it belongs to the grey page, not to the warm ink.
rule           = "#565656"   # grey section rule
table_border   = "#4A4A4A"   # dimmer than the rule, so a grid reads as an outline, not a cage
table_head_bg  = "#3D3D3D"   # a neutral LIFT above the page; heading text 7.4:1, body ink 6.0:1
selection_bg   = "#4A3F63"   # COOL violet — the one place this theme leaves its warm family, and
                             # deliberately. A warm brown here (the first attempt, #4A4230) is the
                             # page and the ink averaged, which is exactly how you arrive at mud:
                             # it reads as a stain rather than as a band. Violet is a hue no other
                             # overlay claims — the four are olive, steel blue, gold and amber — so
                             # a selection can never be mistaken for a find match or an annotation.
                             # Selected text 7.6:1 on it (see selection_fg); the band itself 1.33:1
                             # against the page, enough to see without shouting
selection_fg   = "#E6E4E9"   # near-white, a hair cool. This is the ONE place the sand ink is set
                             # aside, and deliberately: warm tan on a cool violet band is the one
                             # pairing on this page that looks wrong while measuring fine (the
                             # derived answer would be the sand at a perfectly legal 5.3:1). A key
                             # exists for exactly this — contrast is not taste. 7.6:1

# The two code surfaces move in OPPOSITE directions from the page, so an inline span
# can never look like a stray fragment of a fenced block.
code_block_bg  = "#262626"   # recessed below the page (ink 8.3:1)
code_inline_bg = "#3F3F3F"   # lifted above it (ink 5.8:1)

# Overlays are SHADES, not translucent washes — the dark-page rule Candy records
# above: a wash composites toward the page and loses the chroma that made the hue
# worth choosing. The ceiling here is tight, because the ink is a mid-value sand
# rather than a near-white: a fill must sit at L <= 0.0786 for the body text to hold
# 4.5:1 on it, and the page itself is already L 0.0319. So all four live in a narrow
# value band and are told apart by HUE, not by lightness.
annotation_hl   = "#4F4420"   # olive-amber — the annotated-claim overlay (ink 5.3:1)
find_hl_all     = "#2B3F55"   # steel blue — the one COOL hue on the page, so a find match can
                              # never be mistaken for an annotation (ink 6.0:1)
find_hl_current = "#E0A040"   # bright amber, undiluted: the current match is a transient pointer,
                              # and every shipped theme treats it as one (5.7:1 on the page)
mark_bg         = "#51634A"   # muted GREEN band for ==highlight== — the only overlay carrying a
                              # hue from outside the page's warm/steel families, chosen because a
                              # mark must not be mistaken for the violet selection band or the grey
                              # inline-code fill it commonly sits beside. It is also the only band
                              # here that breaks the L<=0.0786 fill ceiling (L 0.1117), which is
                              # exactly why it states its own ink below rather than relying on the
                              # body's: the sand ink reads only 3.58:1 on it
mark_fg         = "#A9CE99"   # light green ink for marked text — 3.70:1 on the band.
                              # ⚠ This is the one colour on the page BELOW the 4.5:1 floor every
                              # other overlay clears; it passes only the 3:1 large-text floor.
                              # Chosen knowingly by the operator over a brighter band that would
                              # have measured 7.31:1, because the two-green pairing is the look
                              # wanted. Recorded here so a future reader does not "fix" it by
                              # accident, and does not copy it as this file's standard

# Geometry: a little airier than the default, which is most of what makes a page feel
# unhurried. Everything else — typography scales, table padding, list step — is
# omitted and therefore inherited from [themes.system].
list_item_gap = 10
rule_space    = 6

# ── Pixel Quest ──────────────────────────────────────────────────────────────────
# A bright, cheerful arcade-platformer reading theme: dark ink on a daylight sky-blue
# page, playful rounded type, and level-title BANDS behind the top two heading levels
# — the first theme to lean on every key `sdd/PLAN.preview-decoration.md` Phase 1/2
# added (per-level heading colour/face, the heading band, glyph list markers, themed
# strikethrough and a styled link underline). Deliberately GENERIC: no franchise
# names, no reproduced character/block art, no image sprites at all — every
# decoration here is a colour, a font stack, or a Unicode glyph, which is what keeps
# it clear of the copyrighted-idiom trap this plan's own deleted spike walked into
# (see the plan's header note — that spike is not revived, and this theme is an
# independent design, not a sanitised copy of it). The page background is the one
# deliberate exception to "independent design": it reuses the specific saturated sky
# blue widely associated with a certain classic platformer's daylight levels. A bare
# hue carries no copyrightable expression and this project asserts no trademark claim
# over "sky blue" — the operator's call, on the same reasoning that ruled out reusing
# imagery (bricks, pipes, character art) but never ruled out a colour. Reusing that
# exact hue as the PAGE rather than an accent forced a page-wide contrast re-tuning:
# it is a mid-luminance blue (L≈0.30), not the pale tint a light reading theme usually
# picks, so every ink below is SHADED (hue kept, lightness dropped) rather than the
# lighter versions an airier page would have allowed — see each key's own contrast
# note.
[themes.pixelquest]
name       = "Pixel Quest"
symbol     = "🕹️"
background = "#5c94fc"   # saturated daylight sky blue — mid-luminance (L≈0.30), not pale
foreground = "#17263b"   # near-navy ink — unchanged from the page's first draft; already
                          # dark enough to clear the new, harder page: 5.15:1 (was 12.51:1
                          # on the original paler blue)
accent     = "#b23a2e"   # warm brick-red — seeds blockquote_bar/selection where not overridden below
link       = "#09361f"   # forest green, SHADED darker for the new page (was #0f5b33) — 4.55:1

# Rounded, friendly display faces — illegible as body text, exactly what a heading
# wants. Neither is packaged on a stock Linux box; both stacks fall through to the
# same rounded sans the body uses, so the theme still reads as "playful" with zero
# fonts installed. Generic-terminated.
font_family  = 'Quicksand, "Baloo 2", Nunito, Cantarell, "Noto Sans", sans-serif'
heading_font = 'Fredoka, "Baloo 2", Quicksand, Cantarell, "Noto Sans", sans-serif'

# PER-LEVEL heading colour/face (TDD 18.21). h1 takes its own bold display face
# ("Titan One"/"Luckiest Guy" — aspirational arcade-title faces, falling through to
# the heading_font stack above where absent); h2/h3 take their own inks; h4 and h5
# fall back to the singular heading_color below (also the table header's ink), so
# the hierarchy has four distinct voices, not five competing ones.
heading_color  = "#5f1010"                                    # h4/h5 + table header text — SHADED darker
                                                               # for the new page (was #7a1414) — 4.53:1
heading_colors = ["#ffd400", "#fff3c4", "#0a2d62", "", ""]     # h1 gold, h2 cream, h3 deep blue (h3 SHADED
                                                                # darker for the new page, was #0e3e86 — 4.54:1;
                                                                # h1/h2 ink is unchanged, checked against their
                                                                # BAND fill below, not the page)
heading_fonts  = ['"Titan One", "Luckiest Guy", sans-serif', "", "", "", ""]

# A level-title BAND behind h1/h2 (TDD 18.25) — solid fills only, deliberately no
# `heading_band_gradient_to`: fading a dark band down to this page's bright sky blue
# would drag the ink's contrast down wherever the gradient runs light, and nothing
# here needs to prove that is safe to ship. Ink is checked against the BAND, not the
# page, since heading text sits on it: h1 gold-on-indigo 8.68:1, h2 cream-on-brown
# 10.19:1.
heading_band_bg     = ["#2b2d6b", "#5b2e1c", "", "", ""]
heading_band_radius = 10

# A furniture-blue rule under every heading (band or not) and taper the space above
# it with the level, same shape Synthwave uses. SHADED darker for the new page (was
# #3e6fa0) to keep clearing the 3:1 non-text floor with margin — 3.30:1 — a decoration
# line is graphic, not text, so it answers to the lower bar, not the 4.5:1 text one.
heading_underline      = "single"
heading_underline_rgba = "#274665"
heading_space_above    = [16, 12, 8, 6, 6]

# Strikethrough and the link underline theme independently of their ink (TDD 18.23).
# A DOUBLE line under links, in a colour distinct from the green ink so the two read
# as separate decisions rather than one blurred stroke; both SHADED darker for the new
# page (were #b23a2e, #c24a1e) and both clear 3:1 with margin (3.32:1, 3.32:1).
strikethrough_rgba  = "#79281f"
link_underline      = "double"
link_underline_rgba = "#752d12"

# GLYPH list markers (TDD 18.24) — a diamond bullet and a star/filled-star task pair
# read as "collectible" furniture without drawing anything. The ordered numeral is
# left alone: overriding it discards the ordinal, and a numbered list staying
# numbered is worth more here than one more glyph.
# `list_marker` is ONE key for bullet, numeral AND task-checkbox alike (SCHEMA.md) —
# there is no per-kind colour, so "the bullets" pop the whole marker family. A bright
# primary blue, not the link's green: markers are furniture, links are content, and
# giving them the same hue was reading as one undifferentiated family. SHADED darker
# for the new page (was #2962ff) — a marker is a graphic, no automated floor governs
# it, but the old value all but vanished against the new, much closer-valued page.
list_marker              = "#0035c9"
# DEPTH-TIERED bullets (TDD 18.26). A nested list reads as a route through the level,
# and a sub-branch in a second colour is the cheapest way to say "this hangs off that".
# SHADED darker for the new page (was #d32011) — 3.01:1, clearing the 3:1 floor a
# non-text graphic answers to — and it is deliberately NOT the brick `accent`
# (#b23a2e), the strikethrough ink (#79281f), or the dark `heading_color` (#5f1010):
# four reds now share this page and value is what tells them apart.
#
# Depth 3 is left UNSET on purpose. It inherits depth 2's red — which is the half of the
# fold worth having visible in a shipped theme, since "the next SHALLOWER tier, not the
# base" is the part a reader would otherwise have to take on trust. A third distinct
# shade was considered and dropped: the only unclaimed bright hue here is the gold, and
# gold already means "level title / collectible" everywhere else in this theme.
list_marker_2            = "#93160c"
list_bullet_glyph        = "◆"
list_task_glyph          = "☆"
list_task_checked_glyph  = "★"
# The task stars get their OWN colour (TDD 18.27) — collectibles are a different family
# from route furniture, and this is the key that lets a theme say so without moving the
# bullets. ONE colour for both states: a checked and an unchecked star are the same
# collectible, taken or not, and the GLYPH already carries which.
#
# A full-saturation magenta at reduced value, not `#ff00ff`. This page is mid-luminance
# (L≈0.30) and bright magenta lands at L≈0.285 — 1.06:1, a colour told apart from the
# page by hue alone and effectively invisible. Every other ink here was shaded down for
# the same reason when the page changed; this one arrives already shaded. 3.37:1 on the
# page (clearing the 3:1 floor a non-text graphic answers to) and 6.96:1 against the gold
# h1 it commonly sits under.
list_task_marker         = "#7a007a"

blockquote_bar       = "#0a2d62"   # matches the new h3 shade (was #0e3e86). KEPT beside the
                                   # sprite below, not replaced: the sprite outranks it, and
                                   # this is what the bar falls back to if the file is ever
                                   # missing, unreadable or refused by `sprite::resolve`
# A riveted copper plate tiled down the quote bar (TDD 18.28) — the one piece of the
# arcade idiom this theme draws rather than states, and an original seamless tile.
# Tiled at its NATURAL size and clipped to the bar, so the bar has to be as wide as the
# tile or a 24px plate shows up as a 4px slice of one: `blockquote_bar_width` is 24 here
# for that reason and no other, and a theme swapping the tile must resize with it.
sprite_blockquote_bar = "sprites/copper-plate.png"
blockquote_bar_width = 24
blockquote_text_gap  = 12
list_item_gap        = 10
rule                 = "#274665"   # matches the new heading-rule shade (was #3e6fa0)
rule_space           = 6
table_border         = "#274665"   # a border carries no text, so it is free of the header-text trap
                                    # below — `table_head_bg` is deliberately left UNSET (derived):
                                    # this theme's singular `heading_color` (#5f1010, dark red) reads
                                    # 1.08:1 on the indigo band colour, so reusing that band as the
                                    # table header fill would have made the header text unreadable.
                                    # Left to derive, the header fill stays legible against whatever
                                    # ink the table actually uses.
table_cell_radius    = 6
table_border_width   = 2
table_cell_padding_v = 6
table_cell_padding_h = 12

# A collectible-gold annotation chip — 10.65:1 for the overflow numeral on it.
annotation_chip_bg = "#ffd400"
annotation_chip_fg = "#17263b"

# Four distinct hue families, one per overlay, same discipline every theme here
# follows: green wash for annotations, gold wash for ==marks==, pale lavender for
# every find match, undiluted orange for the current one.
annotation_hl   = "#4fae6e_61"
mark_bg         = "#ffd400_66"
find_hl_all     = "#d9c6f5"
find_hl_current = "#ff6a3d"
