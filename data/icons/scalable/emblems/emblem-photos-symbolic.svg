<?xml version="1.0" encoding="UTF-8"?>
<!--
  emblem-photos-symbolic — a framed landscape (sun over hills), the standard
  "picture" reading. Drawn for Scribobulate's "show unsafe images" toggle.

  Fills only, no strokes — and NOT for the reason you would guess. GTK wraps a
  symbolic SVG in a generated stylesheet whose first rule is
  `rect,circle,path { fill: <fg> !important; }`, and that `!important` outranks
  an authored `fill="none"`. MEASURED on BOTH GTK 4.6.9 and 4.22.4: an identical
  stroked circle renders as a hollow ring under a plain rasterizer and as a
  SOLID DISC through GTK's symbolic path. So stroked outline art doesn't merely
  lose its colour — it silently changes SHAPE. (On 4.22+ a stroke is also
  dropped unless it opts in with `class="foreground-stroke"`, and a zero-area
  stroked line vanishes entirely; neither happens on 4.6.9, where that class
  does not exist — so the opt-in is NOT a portable fix. Fills-only is.) The frame here is therefore four filled
  bars rather than a stroked rectangle, which would have arrived as a solid
  black square.

  Every edge sits on an integer coordinate and every bar is exactly 1px wide,
  so at 16px the frame lands on the pixel grid instead of smearing across two
  rows. Two plain triangles rather than one jagged ridge line: at icon size a
  polyline's shallow notches fill in and the whole thing reads as a blob.
-->
<svg width="16px" height="16px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
 <g fill="#2e3436">
  <!-- frame: top, bottom, left, right bars -->
  <path d="M2 3 h12 v1 h-12 z"/>
  <path d="M2 12 h12 v1 h-12 z"/>
  <path d="M2 3 h1 v10 h-1 z"/>
  <path d="M13 3 h1 v10 h-1 z"/>
  <!-- sun -->
  <circle cx="5.5" cy="6.2" r="1.3"/>
  <!-- hills, sitting on the bottom bar -->
  <path d="M3 12 L6.9 6.9 L10.8 12 Z"/>
  <path d="M9.6 12 L11.6 9.2 L13 12 Z"/>
 </g>
</svg>
