# cargo-about config for the librsvg Rust dependency notice shipped with Scribobulate's
# Windows installer.
#
# DEV-DEPENDENCIES ARE EXCLUDED DELIBERATELY. librsvg's Cargo.lock resolves 360 packages,
# but only 228 were ever downloaded by the gvsbuild build -- the other 132 are
# dev-dependencies (criterion, assert_cmd, proptest, ...) and their transitive closure,
# which are never compiled into rsvg-2-2.dll. A notice generated from the raw lock would
# assert the shipped DLL contains a benchmarking harness, which is a false statement about
# the product that reads as diligence.
#
# TARGET IS PINNED for the same reason: the lock carries crates for platforms we do not
# ship (android_system_properties and friends). Only the Windows MSVC graph is in the
# artefact.
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false

targets = ["x86_64-pc-windows-msvc"]

accepted = [
    # librsvg's OWN workspace crates (librsvg, librsvg-c, gdk-pixbuf-loader, rsvg_convert,
    # rsvg-bench). These are the Library itself, not third-party dependencies, and they are
    # already covered by the COPYING.LIB we ship. Listed here only so generation does not
    # fail on them; do not read their presence as a third-party LGPL dependency.
    "LGPL-2.1-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
