name: Bug report
description: Something behaves differently than you expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Most fields are optional — fill in
        what you know, and send it even if the rest is blank. A vague report that
        arrives beats a precise one that doesn't. The required ones are marked, and
        they include the two tick-boxes at the bottom.

        **Please check two places before you file.** The
        [open issues](https://github.com/MadMartian/Scribobulate/issues), and
        [`sdd/ISSUES.md`](https://github.com/MadMartian/Scribobulate/blob/master/sdd/ISSUES.md)
        — the maintainers' own register, where a problem may already be recorded and
        understood. Most of what is in that file is short-lived and will be deleted as
        it is fixed, so it is not a public tracker. Its second table, **Closed issues**,
        is the part worth your time: those are limitations with no reachable fix, kept
        deliberately so the same dead end is not investigated twice, and they get
        promoted to GitHub issues in due course. If
        one of them is what you are hitting, say so here rather than filing it as new —
        knowing who actually runs into a limitation is what decides its priority.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
      placeholder: |
        The preview went blank after I switched themes. I expected the document to
        still be there.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: >
        The steps someone else would follow to see the same thing. If it only happens
        sometimes, say roughly how often.
      placeholder: |
        1. Open a document with an image in it
        2. View ▸ Theme ▸ Sepia
        3. Scroll down
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Scribobulate version
      description: Help ▸ About shows it.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: The distribution and release on Linux, or the OS version on macOS and Windows.
      placeholder: "Ubuntu 24.04 / macOS 15.2 / Windows 11 23H2"

  - type: dropdown
    id: install-method
    attributes:
      label: How you installed it
      options:
        - Linux — .deb package
        - Linux — .rpm package
        - Linux — install.sh from source
        - macOS — .app bundle
        - Windows — installer
        - Built from source myself
        - Other / not sure

  - type: textarea
    id: document
    attributes:
      label: Markdown that triggers it
      description: >
        If it depends on document content, the smallest piece of Markdown that still
        shows the problem. This is usually the single most useful thing in a report.
      render: markdown

  - type: textarea
    id: crash-report
    attributes:
      label: Crash report or log output
      description: >
        If the application crashed, it writes a report you can attach — look for
        `crash-*.log` in `~/.local/state/scribobulate` on Linux and macOS, or in
        `%LOCALAPPDATA%\scribobulate` on Windows. Terminal output helps too, if you
        launched it from one.


        ⚠️ **Read it before you paste it.** A crash report replays what the application
        was doing, which includes the full path of every document you had open and the
        address of any remote image it fetched. It does not contain your documents'
        text. Edit out anything you would rather not publish — this is a public issue.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the open GitHub issues and this is not one of them
          required: true
        - label: I checked `sdd/ISSUES.md` and this is not already recorded there
          required: true
        - label: It still happens with a freshly installed configuration
          required: false
