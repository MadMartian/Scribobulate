# Raw GtkTextBuffer undo grouping is banned: it is a construction contract that
# was silently omitted at a call site once (GTK4Rs/AP-110 — a discrete edit made after
# a Redo merged into the redone action's undo group, so one Undo reverted two
# edits). `window::undo::UndoGroup` is the one sanctioned route — its
# constructor flushes the redo-merge barrier and opens the action, its Drop
# closes it — so a new discrete-edit routine cannot re-introduce the bug. The
# guard's own two calls carry an explicit `#[expect(clippy::disallowed_methods)]`.
#
# Every sanctioned caller of a ban below carries `#[expect]`, not `#[allow]`: an
# expectation that stops being met is a build error, so a ban whose path stops
# resolving cannot go quiet.
#
# A ban on one of THIS crate's own items is written twice, once per crate root that
# compiles it: `scribobulate::…` for the library and its tests, `gtk_suite::…` for
# the harness=false suite (`src/gtk_suite.rs`), which compiles the same modules under
# its own crate name. clippy resolves the first path segment as a crate name, so one
# spelling alone leaves the ban silent in the other root (MEASURED: the suite target
# reported every `#[expect]` on `WriteGate::is_busy` unfulfilled; GEP-98).
disallowed-methods = [
    { path = "gtk4::gio::spawn_blocking", reason = "this is the ONLY door onto GLib's shared I/O thread pool, and that pool is shared with the crash-recovery snapshot writer (GTK4Rs/AP-243), where occupying too much of it does not fail a snapshot but makes it LATE. How much this application may hold is decided in src/docio/budget.rs, which asserts the sum of every gate's cap plus the writer's reserve against the pool size at COMPILE TIME. That assertion is only worth anything if every dispatcher is counted, and a fourth one added without a `Consumer` variant is spending a budget nobody accounted for -- which the budget module's own doc comment warned about while nothing enforced it. There are exactly three sanctioned callers, each carrying its own admission gate and its own `#[expect]` naming its variant: docio::pool::off_main (Consumer::Document), animation::worker::on_pool (Consumer::AnimationDecode), window::statusbar::run (Consumer::WordCount). Adding a fourth means adding a variant, a cap and a gate -- not an #[expect]." },
    { path = "gtk4::prelude::TextBufferExt::begin_user_action", reason = "use window::undo::UndoGroup — see clippy.toml" },
    { path = "gtk4::prelude::TextBufferExt::end_user_action", reason = "use window::undo::UndoGroup — see clippy.toml" },
    { path = "gtk4::prelude::TextBufferExt::text", reason = "ScrAP-74: omits anchored children, drifting char offsets vs char_count/slice; use saferizer::BufferText" },
    { path = "gtk4::show_uri", reason = "GTK4Rs/AP-99: swallows launch failure; use links::open_url (show_uri_full)" },
    { path = "gtk4::prelude::TextViewExt::scroll_to_iter", reason = "GTK4Rs/AP-22: immediate pre-validation scroll blanks the view; place a mark and use farscroll::scroll_to_mark_when_ready" },
    { path = "gtk4::prelude::TextViewExt::scroll_to_mark", reason = "GTK4Rs/AP-260: on a document GTK is still laying out, a one-shot scroll_to_mark is DISCARDED, not deferred — the pending request is only ever flushed by first_validate, and the next queue_scroll frees it (measured: Go To Line 30000 on a cold 40k-line file showed line 177, and Ctrl+End never arrived at all). Navigate through farscroll::scroll_to_mark_when_ready, which issues it now AND re-issues it once the layout can answer. The farscroll module's own three calls carry the sole #[expect]s, PLUS three deliberate raw sites that must NOT gain a second driver over an adjustment that already has one (GTK4Rs/AP-172): preview::scroll's warm one-shot restore (its fresh-view sibling is the progressive notify::upper restore) and codeview::geometry's two chained scroll idles (the deferred buffer-offset scroll and the scroll-then-refine cell two-step, whose refine would be undone by a late re-issue)." },
    { path = "gtk4::prelude::AdjustmentExt::set_value", reason = "GTK4Rs/AP-260: a plain adjustment write is an UNCONDITIONAL SUPERSEDE — it calls gtk_adjustment_end_updating and so cancels any scroll animation in flight (every scroll_to_mark/scroll_to_iter animates over ~200ms), leaving the reader part-way to a destination they asked for. GTK's own guard for this, gtk_adjustment_is_animating, is in gtkadjustmentprivate.h: not public, not bound in gtk-rs, so the write CANNOT be made conditional and the decision has to be taken deliberately at the call site. Write positions through saferizer::scrollpos::jump, whose rustdoc states the contract; its single call carries the sole #[expect]. Reading (value/upper/page_size) is unaffected — only writes are banned." },
    { path = "gtk4::prelude::AdjustmentExt::configure", reason = "GTK4Rs/AP-260: configure (and clamp_page) write priv->value DIRECTLY, with none of set_value's end_updating — so unlike a plain write they do NOT stop a scroll animation in flight; the animation's next frame recomputes its interpolation and OVERWRITES the value just written. The write silently does not stick, only while an animation happens to be running. Use saferizer::scrollpos::reconfigure for a geometry republish, or ::jump when you mean to set the position; the seam carries the sole #[expect]s." },
    { path = "gtk4::prelude::AdjustmentExt::clamp_page", reason = "GTK4Rs/AP-260: see AdjustmentExt::configure — same direct priv->value write, same silent overwrite by a running animation." },
    { path = "glib::user_config_dir", reason = "GTK4Rs/AP-3/N10: g_get_user_config_dir caches globally (GTK 4.6 compose table shares it), re-arming the XCompose crash / losing theme overrides; use config::user_config_dir which snapshots std::env before the XDG_CONFIG_HOME redirect" },
    { path = "gio::prelude::AppInfoExt::set_as_default_for_type", reason = "N9: the mimeapps.list symlink workaround only holds because the app never writes app-associations; a write would replace the symlink and lose the user's defaults" },
    { path = "gio::prelude::AppInfoExt::set_as_last_used_for_type", reason = "N9: see set_as_default_for_type — never write app-associations" },
    { path = "gio::prelude::FileMonitorExt::cancel", reason = "GTK4Rs/AP-340: releasing a CANCELLED GFileMonitor after the main context has dispatched aborts the process with STATUS_HEAP_CORRUPTION on Windows — no panic, no GLib warning, no failing assertion, and invisible to the Linux and macOS seats. Cancel through saferizer::DocMonitor::cancel_and_release, which CONSUMES the monitor so no main-loop turn can separate the cancel from the final unref; the seam's single call carries the sole #[expect]. The type is not Clone, so there is no second owned reference to park across a turn." },
    { path = "gio::prelude::FileExt::monitor_file", reason = "GTK4Rs/AP-340: a raw gio::FileMonitor is a reference the cancel ban above cannot protect — build document monitors with saferizer::DocMonitor::attach so the only monitor in the tree is one whose cancellation consumes it. The seam's single call carries the sole #[expect]." },
    { path = "gtk4::prelude::PopoverExt::pointing_to", reason = "C out-parameter: the returned rectangle is UNDEFINED when the returned bool is false, and the (bool, Rectangle) tuple gives no type-level warning. An anchored card is a widgets::floating_card::FloatingCard (a popover is a separate window-system surface the window manager can leave behind), whose pointing_to returns an Option" },
    { path = "gtk4::prelude::TextBufferExt::apply_tag_by_name", reason = "N6: a stringly tag name typos silently (Gtk-WARNING, no styling, no compile error); apply fixed tags via renderer::Renderer::apply + tags::TagName. The typed sink and the dynamic fg-{rrggbb} syntect path (not enumerable) carry an explicit #[expect]." },
    { path = "gtk4::GestureClick::connect_released", reason = "GTK4Rs/AP-169: a handler on `released` alone fires for the release that ENDS A DRAG begun elsewhere, so a swipe-selection ending over a link/marker/checkbox activates it — GTK's own GtkLabel pairs press with release internally and a hand-wired gesture does not; wire activation through saferizer::ClickActivation, which owns both signals. Its single connect_released carries the sole #[expect]. A gesture that genuinely needs the raw release (end-of-press bookkeeping, no activation) may be added here with its reason." },
    { path = "gtk4::LinkButton::with_label", reason = "TDD 2.9a / ScrAP-250: a link in a document is its caption, never a button. A table cell that is nothing but a link is a GtkLabel with an <a href> like every other cell (widgets::table::cell_markup_label): a GtkLinkButton made the whole cell one click target, left its caption unselectable, and hid that caption one level inside the button where every walk over a table's cells missed it. NOTE this ban cannot see the BUILDER spelling (LinkButtonBuilder::label) — same gap as set_tooltip_text below (GTK4Rs/AP-130)." },
    { path = "gtk4::Label::set_attributes", reason = "A table cell's attribute overlay has two writers — find's match washes and the selected-text ink — and a GtkLabel holds ONE list, so a direct write erases the other's. Go through widgets::table::cellattrs::set_layer, which composes the layers and forces the anchored-child repaint a removal needs (GTK4Rs/AP-45, GTK4Rs/AP-92). Its single call carries the sole #[expect]." },
    { path = "gtk4::LinkButton::new", reason = "TDD 2.9a / ScrAP-250: see LinkButton::with_label — a link in a document renders as its caption inside a GtkLabel, never as a GtkLinkButton." },
    { path = "gtk4::prelude::WidgetExt::set_tooltip_text", reason = "a tooltip is not an accessible name and GTK derives neither from the other, so a bare tooltip leaves the control UNNAMED to assistive technology — silently, with every functional test still passing; set both through crate::a11y (name / name_with_accel / name_from_action / name_with_tooltip / describe). The a11y module's own calls carry an explicit #[expect]. NOTE this ban cannot see the BUILDER spelling (…Builder::tooltip_text) — GTK4Rs/AP-130; the live tree-walk guard in src/a11y.rs is the other half." },
    { path = "scribobulate::farscroll::scroll_to_mark_when_ready", reason = "ScrAP-361: in split mode a scroll on the pane that is not leading the scroll sync is put straight back on the next frame, so the command appears to do nothing. It recurred twice (Find, then Undo/Redo), each time at a call site that scrolled the editor without first making it lead. Scroll the editor through window::panescroll::editor_to_mark, which makes the editor lead and then calls this. Sanctioned callers carry #[expect]: panescroll::editor_to_mark itself, and test fixtures that position a view as a precondition rather than navigate." },
    { path = "scribobulate::preview::scroll_preview_to_fragment", reason = "ScrAP-361, the preview side: a link into an already-open split tab scrolled the preview while the editor led the sync, which put the editor's position straight back. Scroll to a fragment through window::panescroll::preview_to_fragment, which makes the preview lead and then calls this; its single call carries the sole #[expect]." },
    { path = "scribobulate::codeview::CodePreviewView::scroll_to_cell_offset", reason = "ScrAP-361, the preview side again: Find's scroll to a match in a table cell was one of the call sites that scrolled the preview without first making it lead the split sync, so the editor's position was put straight back. Scroll to a cell through window::panescroll::preview_to_cell, which makes the preview lead and then calls this; its single call carries the sole #[expect]. (scroll_to_buffer_offset is not banned beside it: most of its callers are not navigations — see panescroll's header.)" },
    { path = "gtk_suite::codeview::CodePreviewView::scroll_to_cell_offset", reason = "the same ban for the gtk_suite crate root, which compiles this module under its own name; see the scribobulate:: entry above for the rule" },
    { path = "gtk_suite::preview::scroll_preview_to_fragment", reason = "the same ban for the gtk_suite crate root, which compiles this module under its own name; see the scribobulate:: entry above for the rule" },
    { path = "gtk_suite::farscroll::scroll_to_mark_when_ready", reason = "the same ban for the gtk_suite crate root, which compiles this module under its own name; see the scribobulate:: entry above for the rule" },
    { path = "scribobulate::winstate::writegate::WriteGate::is_busy", reason = "the ONE SANCTIONED CALLER rule at the method's rustdoc, given teeth. Reading the gate and then acting is the check-then-act race WritePass exists to make unrepresentable, and the rule had NO enforcement — it was prose on a pub(crate) method, so a second caller would have cost nothing and broken nothing visibly. Exactly one production site is sanctioned and carries the sole #[allow]: app::open's file-monitor closure classifying an ALREADY-HAPPENED Deleted event as ours or external. It qualifies because it decides nothing about a future write, has no await between the read and the decision, and runs on the same single-threaded main context as the pass it asks about. A new caller that does not meet all three wants WriteGate::claim. Test callers assert on the gate rather than branching to write, and carry their own #[allow]." },
    { path = "gtk_suite::winstate::writegate::WriteGate::is_busy", reason = "the same ban for the gtk_suite crate root, which compiles this module under its own name; see the scribobulate:: entry above for the rule" },
    { path = "gtk4::prelude::TextTagExt::set_overline_rgba", reason = "CONFIRMED against gtk 4.6.9-5-g492b44f20c source: gtk_text_attributes_unref (gtk/gtktextattributes.c) has a copy-paste typo — its overline_rgba guard frees underline_rgba instead — so a text RUN carrying both a coloured overline and a coloured underline DOUBLE-FREES underline_rgba and leaks overline_rgba; overline_rgba set ALONE still leaks 16B every destruction, which is why this key does not exist even unpaired. Reproduced independently: TextTag::new, set overline-rgba and underline-rgba, drop it — valgrind reports Invalid free() of a 16-byte GdkRGBA, and repetitions poison the heap until an unrelated gtk::Box::new SIGSEGVs elsewhere (GTK_A11Y=none does not help). Every copy path (copy_values, the run-merge in _gtk_text_attributes_fill_from_tags) deep-copies correctly — nothing is aliased, splitting the two across two tags applied to one range does not escape it because the merge still produces one GtkTextAttributes and that struct's own destructor misfires — so the invariant is per RUN, not per tag, and a link inside a heading is such a run. Fixed upstream in GTK by commit 86e962929bf2be13a721053141b33e4381f0312 (Coverity CID 1621077, GitLab MR !8137) in GTK 4.16.13 and 4.18.0; never backported to any earlier stable branch. The project therefore sets underline-rgba and NEVER overline-rgba: an overline is drawn in the run's own ink (theme::HeadingRule carries the finding and the design). There is no sanctioned caller — this ban has no #[expect] anywhere, which is the point. Lift it only once the toolkit floor passes 4.16.13, and re-measure before you do. Full finding lives in the gtk4-rs skill as GTK4Rs/AP-308." },
    { path = "gtk4::prelude::TextBufferExt::insert_markup", reason = "probes/README.md arm R3: GtkTextBufferImpl::insert_text's binding truncates a BOUNDED-LENGTH insert — the `new_text_length` argument is not honoured, so a caller that passes a length rather than a NUL-terminated whole string silently inserts the wrong text. `insert_markup` is one of the two reachable callers named there. The lone-CR repair hook rides on `insert_text`, so this is a live path, not a hypothetical. If a genuine need arises, RE-RUN ARM R3 first and record the result — do not simply add an #[expect]. (`insert_with_attributes`, the other caller the probe names, is NOT BOUND in gtk4-rs 0.10 and so needs no ban; verified against the crate source rather than assumed, because a ban on an unresolvable path fails open and looks installed.)" },
    { path = "gtk4::gdk::Clipboard::set_text", reason = "on macOS GTK 4.22 publishes text only as a lazy pasteboard PROMISE, and answering it livelocks the process when the request lands inside GDK's own event-source prepare() (an autorelease-pool drain frees an NSWindow whose input-method teardown runs a nested CFRunLoop that services the pasteboard; GDK then waits for the data by iterating the main context, which GLib refuses from inside prepare, so it spins forever logging `g_main_context_prepare() called recursively`). Any eager clipboard reader — clipboard-history or clipboard-sharing apps — makes it likely. Fixed upstream in GTK 4.24.0 (MR !10216). Write through crate::clipboard::set_text, which writes the macOS pasteboard eagerly; its single call carries the sole #[expect]. Tests that seed the clipboard directly may carry their own #[expect]. Lift this once the toolkit floor on macOS reaches 4.24.0." },
    { path = "gtk4::gdk::Texture::from_bytes", reason = "ScrAP-351 / ScrAP-352, and this tree's one-choke-point rule: this hands encoded bytes to gdk-pixbuf's loader chain, which leaks ~12 MB/call on an animated WebP. Read the file through src/imagedecode::read_local and decode through src/imagedecode::decode, which sniffs by content and routes WebP/GIF/APNG to richimg instead. src/imagedecode is the only sanctioned caller." },
    { path = "gtk4::gdk::Texture::from_file", reason = "ScrAP-351: same leaking gdk-pixbuf loader chain as Texture::from_bytes, entered by a different door. Use src/imagedecode::read_local + src/imagedecode::decode. src/imagedecode is the only sanctioned caller." },
    { path = "gtk4::gdk::Texture::from_filename", reason = "ScrAP-351: same leaking gdk-pixbuf loader chain, by filename. Use src/imagedecode::read_local + src/imagedecode::decode. src/imagedecode is the only sanctioned caller." },
    { path = "gtk4::gdk_pixbuf::Pixbuf::from_stream", reason = "ScrAP-351: the gdk-pixbuf loader chain that leaks on animated WebP. Use src/imagedecode::decode (or ::decode_pixbuf for a caller that needs pixel-level resampling), which sniffs by content and routes WebP/GIF/APNG to richimg first. src/imagedecode is the only sanctioned caller." },
    { path = "gtk4::gdk_pixbuf::PixbufLoader::new", reason = "ScrAP-351 / ScrAP-352: the incremental form of the same leaking loader chain. The dimension-only probe in src/imagedecode::probe_pixel_size (GTK4Rs/AP-311's set_size(0,0) discipline) and the full decode in src/imagedecode::decode_pixbuf are the sanctioned callers — src/imagedecode is the only module that may construct one." },
    { path = "gtk4::gdk_pixbuf::Pixbuf::from_file_at_scale", reason = "ScrAP-351, and this tree's one-choke-point rule: the SCALED vector re-render, and the last path-taking decode in the tree. It was exempt from this ban for one round on the argument that a vector must be decoded AT A TARGET SIZE and only the path-based entry point takes one — true about the size, false about the path: from_stream_at_scale takes the same size from a byte stream. The exemption cost a check-then-use seam, because imagecache::loader had ALREADY read, admitted and content-sniffed the file, and this re-opened it BY NAME afterwards, so the bytes decoded were never the bytes checked and the byte cap bounded nothing about the second read. Use src/imagedecode::rasterize_vector_bytes, which takes the admitted buffer. There is no sanctioned caller and no #[expect] anywhere — that is the point." },
    { path = "gtk4::gdk_pixbuf::Pixbuf::from_stream_at_scale", reason = "ScrAP-351: the same gdk-pixbuf loader chain, taking a target size. src/imagedecode::rasterize_vector_bytes is the ONE sanctioned caller and carries the sole #[expect] — it is reached only after imagedecode::read_local has admitted the bytes and probe_vector_dimensions has confirmed from CONTENT that they are scalable. A caller that reaches it without those two steps is deciding to decode something it has not checked." },
    { path = "gtk4::prelude::WidgetExt::queue_allocate", reason = "on GTK 4.6 a bare queue_allocate can be SILENTLY DROPPED: its upward walk stops at the first ancestor already marked as having a child to allocate, and that ancestor is then skipped at paint -- a blank widget or a blank window region until something unrelated forces layout (GTK4Rs/AP-104; TDD 7.26, 7.28). Use queue_resize. The only sanctioned callers are position-only animation/scroll ticks that fire every frame, where the next frame re-issues the request; each carries an #[expect] saying so." },
]

# GtkSourceView reaches a bounded-length insert internally at two audited sites in the
# 5.20.0 tarball, so enabling either feature re-arms the truncation above from INSIDE the
# library, where no ban on our own call sites can see it. probes/README.md arm R3 is the
# measurement that must be re-run before either is turned on; this makes that obligation a
# build failure rather than a sentence in a README nobody re-reads.
disallowed-types = [
    { path = "sourceview5::CompletionWords", reason = "probes/README.md arm R3: gtksourcecompletionwords.c reaches a bounded-length gtk_text_buffer_insert internally. Re-run arm R3 and record the result BEFORE enabling completion." },
]
