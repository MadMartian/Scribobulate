# Raw GtkTextBuffer undo grouping is banned: it is a construction contract that
# was silently omitted at a call site once (ScrAP-108 — a discrete edit made after
# a Redo merged into the redone action's undo group, so one Undo reverted two
# edits). `window::undo::UndoGroup` is the one sanctioned route — its
# constructor flushes the redo-merge barrier and opens the action, its Drop
# closes it — so a new discrete-edit routine cannot re-introduce the bug. The
# guard's own two calls carry an explicit `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "gtk4::prelude::TextBufferExt::begin_user_action", reason = "use window::undo::UndoGroup — see clippy.toml" },
    { path = "gtk4::prelude::TextBufferExt::end_user_action", reason = "use window::undo::UndoGroup — see clippy.toml" },
    { path = "gtk4::prelude::TextBufferExt::text", reason = "ScrAP-74: omits anchored children, drifting char offsets vs char_count/slice; use saferizer::BufferText" },
    { path = "gtk4::show_uri", reason = "ScrAP-129: swallows launch failure; use links::open_url (show_uri_full)" },
    { path = "gtk4::prelude::TextViewExt::scroll_to_iter", reason = "ScrAP-22: immediate pre-validation scroll blanks the view; place a mark and use farscroll::scroll_to_mark_when_ready" },
    { path = "gtk4::prelude::TextViewExt::scroll_to_mark", reason = "ScrAP-260: on a document GTK is still laying out, a one-shot scroll_to_mark is DISCARDED, not deferred — the pending request is only ever flushed by first_validate, and the next queue_scroll frees it (measured: Go To Line 30000 on a cold 40k-line file showed line 177, and Ctrl+End never arrived at all). Navigate through farscroll::scroll_to_mark_when_ready, which issues it now AND re-issues it once the layout can answer. The farscroll module's own three calls carry the sole #[allow]s, PLUS three deliberate raw sites that must NOT gain a second driver over an adjustment that already has one (ScrAP-149): preview::scroll's warm one-shot restore (its fresh-view sibling is the progressive notify::upper restore) and codeview::geometry's two chained scroll idles (the deferred buffer-offset scroll and the scroll-then-refine cell two-step, whose refine would be undone by a late re-issue)." },
    { path = "gtk4::prelude::AdjustmentExt::set_value", reason = "ScrAP-260: a plain adjustment write is an UNCONDITIONAL SUPERSEDE — it calls gtk_adjustment_end_updating and so cancels any scroll animation in flight (every scroll_to_mark/scroll_to_iter animates over ~200ms), leaving the reader part-way to a destination they asked for. GTK's own guard for this, gtk_adjustment_is_animating, is in gtkadjustmentprivate.h: not public, not bound in gtk-rs, so the write CANNOT be made conditional and the decision has to be taken deliberately at the call site. Write positions through saferizer::scrollpos::jump, whose rustdoc states the contract; its single call carries the sole #[allow]. Reading (value/upper/page_size) is unaffected — only writes are banned." },
    { path = "gtk4::prelude::AdjustmentExt::configure", reason = "ScrAP-260: configure (and clamp_page) write priv->value DIRECTLY, with none of set_value's end_updating — so unlike a plain write they do NOT stop a scroll animation in flight; the animation's next frame recomputes its interpolation and OVERWRITES the value just written. The write silently does not stick, only while an animation happens to be running. Use saferizer::scrollpos::reconfigure for a geometry republish, or ::jump when you mean to set the position; the seam carries the sole #[allow]s." },
    { path = "gtk4::prelude::AdjustmentExt::clamp_page", reason = "ScrAP-260: see AdjustmentExt::configure — same direct priv->value write, same silent overwrite by a running animation." },
    { path = "glib::user_config_dir", reason = "ScrAP-3/N10: g_get_user_config_dir caches globally (GTK 4.6 compose table shares it), re-arming the XCompose crash / losing theme overrides; use config::user_config_dir which snapshots std::env before the XDG_CONFIG_HOME redirect" },
    { path = "gio::prelude::AppInfoExt::set_as_default_for_type", reason = "N9: the mimeapps.list symlink workaround only holds because the app never writes app-associations; a write would replace the symlink and lose the user's defaults" },
    { path = "gio::prelude::AppInfoExt::set_as_last_used_for_type", reason = "N9: see set_as_default_for_type — never write app-associations" },
    { path = "gtk4::prelude::PopoverExt::pointing_to", reason = "C out-parameter: the returned rectangle is UNDEFINED when the returned bool is false, and the (bool, Rectangle) tuple gives no type-level warning; use saferizer::pointing_to" },
    { path = "gtk4::prelude::TextBufferExt::apply_tag_by_name", reason = "N6: a stringly tag name typos silently (Gtk-WARNING, no styling, no compile error); apply fixed tags via renderer::Renderer::apply + tags::TagName. The typed sink and the dynamic fg-{rrggbb} syntect path (not enumerable) carry an explicit #[allow]." },
    { path = "gtk4::GestureClick::connect_released", reason = "ScrAP-238: a handler on `released` alone fires for the release that ENDS A DRAG begun elsewhere, so a swipe-selection ending over a link/marker/checkbox activates it — GTK's own GtkLabel pairs press with release internally and a hand-wired gesture does not; wire activation through saferizer::ClickActivation, which owns both signals. Its single connect_released carries the sole #[allow]. A gesture that genuinely needs the raw release (end-of-press bookkeeping, no activation) may be added here with its reason." },
    { path = "gtk4::LinkButton::with_label", reason = "ScrAP-250: a bare GtkLinkButton puts its caption INSIDE the button, where every walk over a table's cells (find-in-preview, and anything else that reads cell text) misses it — the reader sees the link text on the page and find reports No matches; build it with widgets::table::link_cell_button, whose twin link_cell_caption is how that text is read back. The seam's own call and the two GTK-emission probes in renderer::end (which construct a bare button on purpose, to prove Propagation::Stop halts GTK's default handler) carry the only #[allow]s. NOTE this ban cannot see the BUILDER spelling (LinkButtonBuilder::label) — same gap as set_tooltip_text below (ScrAP-230)." },
    { path = "gtk4::LinkButton::new", reason = "ScrAP-250: see LinkButton::with_label — a link cell is built by widgets::table::link_cell_button so its caption stays readable back through link_cell_caption." },
    { path = "gtk4::prelude::WidgetExt::set_tooltip_text", reason = "a tooltip is not an accessible name and GTK derives neither from the other, so a bare tooltip leaves the control UNNAMED to assistive technology — silently, with every functional test still passing; set both through crate::a11y (name / name_with_accel / name_from_action / name_with_tooltip / describe). The a11y module's own calls carry an explicit #[allow]. NOTE this ban cannot see the BUILDER spelling (…Builder::tooltip_text) — ScrAP-230; the live tree-walk guard in src/a11y.rs is the other half." },
]
